[project]
name = "bci"
version = "0.1.0"
description = "EEG Hat eight-channel MI, c-VEP and SSVEP decoding pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.2,<2",
    "joblib>=1.2,<2",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

